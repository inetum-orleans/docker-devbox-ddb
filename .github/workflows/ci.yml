name: build
on:
  push: ~
  pull_request: ~
jobs:
  ci-linux:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    name: Python ${{ matrix.python-version }} (Linux)

    strategy:
      fail-fast: false
      matrix:
        # Keep this in sync with tox.ini
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Install YTT
        run: |
          mkdir -p $HOME/bin
          curl -fLo $HOME/bin/ytt https://github.com/carvel-dev/ytt/releases/download/v0.55.1/ytt-linux-amd64
          echo "$HOME/bin" >> $GITHUB_PATH
          chmod +x $HOME/bin/ytt

      - name: Check YTT version
        run: ytt --version

      - name: Sync dependencies
        run: uv sync --no-dev --group test

      # The threshold is enforced by the dedicated step below, so a coverage drop is reported as its own
      # failure instead of a pytest one.
      - name: Pytest (Coverage)
        run: uv run --no-sync pytest --cov=ddb --cov-report=xml --cov-fail-under=0

      - name: Coverage threshold
        run: uv run --no-sync coverage report

      # `files` is required: the uploader does not read coverage.py's own `.coverage` data file.
      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

  ci-macos:
    runs-on: macos-latest

    name: Python 3.14 (MacOS)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Install YTT
        run: |
          mkdir -p $HOME/bin
          curl -fLo $HOME/bin/ytt https://github.com/carvel-dev/ytt/releases/download/v0.55.1/ytt-darwin-amd64
          echo "$HOME/bin" >> $GITHUB_PATH
          chmod +x $HOME/bin/ytt

      - name: Install Docker CLI
        # The runners have no docker daemon, but `docker compose config` runs locally and
        # the features under test shell out to it.
        run: |
          brew install docker docker-compose
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose

      - name: Sync dependencies
        run: uv sync --no-dev --group test

      - name: Pytest (Coverage)
        # The macOS runners have no docker daemon, so the threshold cannot be met here.
        run: uv run --no-sync pytest --cov=ddb -m "not docker" --cov-fail-under=0

  ci-windows:
    runs-on: windows-latest

    name: Python 3.14 (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Install YTT
        run: |
          mkdir "$HOME\bin"
          curl -fLo "$HOME\bin\ytt.exe" https://github.com/carvel-dev/ytt/releases/download/v0.55.1/ytt-windows-amd64.exe
          echo "$HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sync dependencies
        run: uv sync --no-dev --group test

      - name: Pytest (Coverage)
        # The windows runners have no docker daemon, so the threshold cannot be met here.
        run: uv run --no-sync pytest --cov=ddb -m "not docker" --cov-fail-under=0

  pre-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      # Runs the whole .pre-commit-config.yaml (ruff check, ruff format, mypy) — the
      # same hooks developers run locally, so CI and local stay in sync from one config.
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  commit-messages:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      # commitizen shares [tool.commitizen] with the local commit-msg hook.
      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}..HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.sha }}"
            fi
          fi
          echo "Checking commit messages in range: $range"
          uv run --no-sync cz check --rev-range "$range"

  build-python-linux:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    needs: [ ci-linux ]

    runs-on: ubuntu-latest

    name: Build (Linux Python package)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Sync dependencies
        run: uv sync --group dev

      # Stamps the next version into ddb/__version__.py without committing or
      # tagging: the release job below owns the actual version commit.
      - name: Bump version
        run: uv run --no-sync semantic-release -v version --no-commit --no-tag --no-push --no-changelog --skip-build

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: ddb-python
          path: ./dist

  build-bin-linux:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    needs: [ ci-linux ]

    runs-on: ubuntu-22.04

    name: Build (Linux Binary)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Bump version
        run: uv run --no-sync semantic-release -v version --no-commit --no-tag --no-push --no-changelog --skip-build

      - name: Binary
        run: uv run --no-sync pyinstaller --dist ./dist ddb.spec

      - name: Smoke test
        run: ./.build/smoke-test.sh ./dist/ddb

      - uses: actions/upload-artifact@v4
        with:
          name: ddb-bin-linux
          path: ./dist

  build-bin-alpine:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    needs: [ ci-linux ]

    runs-on: ubuntu-latest

    name: Build (Alpine Binary)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Bump version
        run: uv run --no-sync semantic-release -v version --no-commit --no-tag --no-push --no-changelog --skip-build

      - name: Build in alpine container
        run: docker build -f .build/Dockerfile.builder.alpine . -t ddb-builder-alpine

      - name: Binary
        run: |
          mkdir -p ./dist
          id=$(docker create ddb-builder-alpine)
          docker cp "$id:/usr/local/bin/ddb" ./dist/ddb
          docker rm -v $id

      # Run inside the alpine image: the musl binary is not meant to run on the ubuntu runner. The runtime
      # image is bare, so it gets the shell and git ddb expects from any developer machine.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh -e SHELL=/bin/bash -v "$PWD/.build:/build" ddb-builder-alpine -c \
            'apk add --no-cache bash git && /build/smoke-test.sh /usr/local/bin/ddb'

      - uses: actions/upload-artifact@v4
        with:
          name: ddb-bin-alpine
          path: ./dist

  build-bin-windows:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: windows-latest

    name: Build (Windows)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Bump version
        run: uv run --no-sync semantic-release -v version --no-commit --no-tag --no-push --no-changelog --skip-build

      - name: Binary
        run: uv run --no-sync pyinstaller --dist .\dist ddb.spec

      - name: Smoke test
        run: .\.build\smoke-test.ps1 .\dist\ddb.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ddb-bin-windows
          path: ./dist

  build-bin-macos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: macos-latest

    name: Build (MacOS)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Bump version
        run: uv run --no-sync semantic-release -v version --no-commit --no-tag --no-push --no-changelog --skip-build

      - name: Binary
        run: uv run --no-sync pyinstaller --dist ./dist ddb.spec

      - name: Smoke test
        run: ./.build/smoke-test.sh ./dist/ddb

      - uses: actions/upload-artifact@v4
        with:
          name: ddb-bin-macos
          path: ./dist

  release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [ commit-messages, pre-commit, build-python-linux, build-bin-linux, build-bin-windows, build-bin-macos, build-bin-alpine ]

    runs-on: ubuntu-latest

    permissions:
      contents: write

    name: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Sync dependencies
        run: uv sync --group dev

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy artifacts to ./dist
        run: |
          mkdir -p ./dist
          mv artifacts/ddb-bin-linux/ddb ./dist/ddb-linux
          mv artifacts/ddb-bin-alpine/ddb ./dist/ddb-alpine
          mv artifacts/ddb-bin-macos/ddb ./dist/ddb-macos
          mv artifacts/ddb-bin-windows/ddb.exe ./dist/ddb-windows.exe
          mv artifacts/ddb-python/* ./dist

      # Commits and tags the new version, generates the changelog and creates the
      # GitHub release. `build_command = "uv lock"` keeps uv.lock in sync with it.
      - name: Bump version
        run: uv run semantic-release -v version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }} dist/*.whl dist/*.tar.gz

      # Attaches ./dist to the GitHub release created above.
      - name: Publish release
        run: uv run semantic-release -v publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge master to develop
        uses: robotology/gh-action-nightly-merge@v1.5.0
        with:
          stable_branch: 'master'
          development_branch: 'develop'
          allow_ff: true
          user_name: github-actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
