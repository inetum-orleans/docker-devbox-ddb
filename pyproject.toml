[project]
name = "docker-devbox-ddb"
dynamic = ["version"]
description = "ddb - Erase environment differences, make developers happy !"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rémi Alvergnat", email = "remi.alvergnat@gfi.world" }]
keywords = [
    "docker",
    "docker-compose",
    "development",
    "environment",
    "devops",
    "templates",
    "jsonnet",
    "jinja",
    "watch",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "braceexpand",
    "cfssl>=0.0.3b243",
    "chmod-monkey>=1.1.1",
    "colorama",
    "colorlog",
    "cookiecutter",
    "cryptography",
    "deepmerge",
    "dictdiffer",
    "diskcache",
    "distro",
    # docker-py is a runtime dependency: ddb.feature.docker.lib.compose imports
    # docker.utils.ports, and that module is loaded by the docker feature itself.
    "docker",
    "dockerfile-parse",
    "dotty-dict",
    "gitpython",
    "Jinja2",
    # Official google/jsonnet bindings, exposing the same `_jsonnet` module as the
    # unmaintained jsonnet-binary fork, with abi3 wheels up to Python 3.14.
    "jsonnet>=0.22",
    "marshmallow",
    "marshmallow-union",
    "ordered-set",
    "paramiko",
    "patch",
    "progress",
    # Replaces netifaces (unmaintained since 2021, no longer compiles with recent
    # compilers) for network interface lookup; ships wheels everywhere.
    "psutil",
    "python-on-whales",
    "python-slugify",
    "PyYAML",
    "requests",
    "semver",
    "toposort",
    "verboselogs",
    # Pinned: watchdog 5 hangs the test suite, see issue #242.
    "watchdog==4.0.2",
    "wcmatch",
    "zgitignore",
]

[project.urls]
Homepage = "https://inetum-orleans.github.io/docker-devbox-ddb"
Documentation = "https://inetum-orleans.github.io/docker-devbox-ddb"
Repository = "https://github.com/inetum-orleans/docker-devbox-ddb"
Changelog = "https://github.com/inetum-orleans/docker-devbox-ddb/blob/develop/CHANGELOG.md"

[project.scripts]
ddb = "ddb.__main__:console_script"

[project.entry-points.pytest11]
docker_compose = "pytest_docker_compose:plugin"

[dependency-groups]
test = [
    "coverage",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-mock",
    "pytest-profiling",
    "responses",
    "waiting",
]
lint = ["mypy", "ruff"]
build = ["pex", "pyinstaller"]
dev = [
    { include-group = "build" },
    { include-group = "lint" },
    { include-group = "test" },
    # Tooling driven by .pre-commit-config.yaml: the hooks run via `uv run`, so
    # these must be in the dev env / uv.lock — pre-commit itself, ruff (via the
    # lint group above) and commitizen.
    "commitizen",
    "pre-commit",
    "python-semantic-release",
    "tox",
    "tox-uv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ddb/__version__.py"

[tool.hatch.build.targets.wheel]
# pytest_docker_compose is a vendored fork shipped with the package: it is
# exposed as a pytest plugin through the pytest11 entry point above.
packages = ["ddb", "pytest_docker_compose"]

[tool.commitizen]
# Conventional Commits ruleset, used by `cz check` (local commit-msg hook + CI).
name = "cz_conventional_commits"

[tool.semantic_release]
version_variables = ["ddb/__version__.py:__version__"]
# `uv lock` re-stamps the bumped version into uv.lock (which pins ddb's own
# version); `assets` includes it in the release commit so the lockfile never
# drifts behind the released version. Wheels, sdist and binaries are built by
# the dedicated CI jobs, so no `uv build` is needed here.
build_command = "uv lock"
assets = ["uv.lock"]
commit_message = "chore(release): release v{version}"
commit_author = "github-actions <actions@github.com>"

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored code kept as close as possible to its upstream source, and test fixtures
# standing in for user written plugins and projects.
extend-exclude = [
    "ddb/feature/docker/lib",
    "ddb/utils/simpleeval.py",
    "pytest_docker_compose",
    "tests/**/*.data",
]
# Honour the exclusions even for paths passed explicitly, as pre-commit does.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "ISC",  # flake8-implicit-str-concat
    "TC",   # flake8-type-checking
    "FA",   # flake8-future-annotations
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "D",    # pydocstyle
    "S",    # flake8-bandit
    "EM",   # flake8-errmsg
    "TRY",  # tryceratops
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "DTZ",  # flake8-datetimez
    "FBT",  # flake8-boolean-trap
    "PTH",  # flake8-use-pathlib
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
]
ignore = [
    # Base classes expose optional hooks (before_load, close, flush, warn, ...) as
    # empty methods: subclasses override the ones they care about.
    "B024",
    "B027",
    # Long log and error messages are built from adjacent literals across lines.
    "ISC002",
    # Collapsing nested `if`s hurts readability with the long conditions used here.
    "SIM102",
    # `for k in d.keys()` is not interchangeable with `for k in d` here: caches and
    # dotty dicts expose keys() without being iterable themselves.
    "SIM118",
    # Exception classes predate this rule and are part of the public API; renaming
    # them to a `Error` suffix would be a breaking change.
    "N818",
    # Docstrings are written across several lines with the summary below the opening
    # quotes, which is the house style throughout the codebase.
    "D200",
    "D205",
    "D212",
    # Modules, packages, magic methods, __init__ and overridden methods inherit their
    # documentation from the class or the interface they implement.
    "D100",
    "D102",
    "D104",
    "D105",
    "D107",
    # Imperative mood is not worth rewording existing summaries for.
    "D401",
    # Event processors, binary implementations and merge strategies must match the
    # signature of the interface they implement, unused parameters included.
    "ARG001",
    "ARG002",
    "ARG004",
    "ARG005",
    # The configuration layer genuinely passes Any around: dotty dicts, deepmerge
    # strategies and cache entries hold arbitrary user configuration.
    "ANN401",
    # Messages passed straight to raise read better than a variable per exception.
    "TRY003",
    # Raising inside try is how the config and action pipelines report failures they
    # then translate; splitting those blocks would obscure the flow.
    "TRY301",
    # `return` at the end of a try block reads fine when the try only guards the
    # statements above it.
    "TRY300",
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.mccabe]
# Tightest threshold the codebase currently passes.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Shelve caches and rendered templates own file handles that outlive the call.
# S301: shelve pickles ddb's own cache entries, written and read back locally.
"ddb/cache/shelve_cache.py" = ["SIM115", "S301"]
# S603: running configured processes is what this helper is for.
"ddb/utils/process.py" = ["S603"]
# S701: templates render configuration files (yaml, toml, ini), never HTML, and
# autoescaping would corrupt them.
"ddb/feature/jinja/actions.py" = ["S701"]
"ddb/feature/ytt/actions.py" = ["SIM115"]
"ddb/utils/file.py" = ["SIM115"]
# Embedded traefik configuration templates, kept verbatim.
"ddb/feature/traefik/schema.py" = ["E501"]
# Tests assert on full command lines, patch with plain functions rather than mock
# return values, and check raised messages with `str(excinfo.value)` after the block.
# Test classes and helpers document themselves through their names and patch with
# lambdas. Annotating test functions and pytest fixtures brings nothing: they are never
# called from other code.
"tests/**" = ["ANN", "ARG", "D", "DTZ", "E501", "N802", "PT008", "PT011", "PT012", "S", "TRY"]

[tool.pytest.ini_options]
addopts = "-s --ignore=build --ignore=docs --docker-compose-remove-volumes"
testpaths = ["tests"]
markers = ["docker: marks tests requiring docker engine"]

[tool.coverage.run]
omit = ["ddb/__version__.py", "ddb/utils/simpleeval.py", "pytest_docker_compose/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
# Measured by the linux job, which is the only one running the whole suite. Raise it as gaps get closed; runs
# skipping tests (`-m "not docker"`, a single test file) need `--cov-fail-under=0` to opt out.
fail_under = 94

[tool.mypy]
files = ["ddb"]
strict = true
ignore_missing_imports = true
# Vendored code, kept as close as possible to its upstream source.
exclude = ["ddb/feature/docker/lib/", "ddb/utils/simpleeval\\.py"]

[[tool.mypy.overrides]]
# follow_imports keeps the untyped signatures of the vendored code excluded above from
# leaking into the modules that call it.
module = ["ddb.utils.simpleeval", "ddb.feature.docker.lib.*"]
ignore_errors = true
follow_imports = "skip"
